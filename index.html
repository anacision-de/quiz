<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="app">
      <section id="intro" class="intro">
        <div class="intro-content">
          <h1 id="intro-title"></h1>
          <p id="intro-description"></p>
          <div id="intro-actions" class="intro-actions">
            <button id="prepare-button" class="primary-button" type="button" disabled>Kamera vorbereiten</button>
            <button id="start-button" class="primary-button secondary-button" type="button" disabled>Starten</button>
          </div>
          <nav id="catalog-links" class="catalog-links hidden" aria-label="Verfügbare Fragenkataloge"></nav>
          <p id="camera-note" class="status-text" aria-live="polite"></p>
        </div>
      </section>

      <section id="quiz" class="quiz hidden" aria-live="polite">
        <header class="question-panel">
          <p id="progress" class="progress"></p>
          <h2 id="question-text" class="question-text"></h2>
          <div id="timer" class="timer" aria-label="Verbleibende Zeit">
            <span id="timer-value" class="timer-value">0s</span>
          </div>
        </header>

        <section id="answers" class="answers" aria-label="Antwortbereiche"></section>

        <video id="camera-video" class="camera-video" autoplay muted playsinline></video>
        <canvas id="analysis-canvas" class="analysis-canvas"></canvas>

        <div id="feedback" class="feedback hidden"></div>
      </section>

      <section id="result" class="result hidden">
        <div id="result-card" class="result-card">
          <div class="result-copy">
            <p id="result-score" class="result-score"></p>
            <h2 id="result-title"></h2>
            <p id="result-description"></p>
            <button id="restart-button" class="primary-button" type="button">Nochmal spielen</button>
            <div class="result-share">
              <a id="certificate-link" class="certificate-link" href="certificate.html" aria-label="Urkundenseite öffnen">
                <canvas id="certificate-qr" class="certificate-qr" aria-label="QR-Code zur Urkunde"></canvas>
              </a>
              <p id="certificate-qr-note">QR-Code scannen und Urkunde erstellen.</p>
            </div>
          </div>
        </div>
        <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>
      </section>
    </main>

    <script src="vendor/qrcode-generator.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
